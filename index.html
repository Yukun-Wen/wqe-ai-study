<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#12161c">
<title>学习资料</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    padding:24px 18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#12161c;color:#e6edf3;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%;max-width:380px;
    background:#1a2029;border:1px solid #2a3340;border-radius:16px;
    padding:26px 22px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .lock{
    width:44px;height:44px;margin:0 0 16px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:#232c38;border:1px solid #2f3a49;
  }
  .lock svg{width:22px;height:22px;stroke:#7fb3ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0 0 6px;font-size:19px;font-weight:650;letter-spacing:.3px}
  .sub{margin:0 0 20px;font-size:13.5px;line-height:1.6;color:#8b98a9}
  label.fl{display:block;font-size:12px;color:#8b98a9;margin:0 0 7px;letter-spacing:.4px}
  input[type=password]{
    width:100%;padding:13px 14px;font-size:16px;
    color:#e6edf3;background:#0f141a;
    border:1px solid #2f3a49;border-radius:10px;outline:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:1px;
    transition:border-color .15s,box-shadow .15s;
  }
  input[type=password]:focus{border-color:#4a7fd4;box-shadow:0 0 0 3px rgba(74,127,212,.18)}
  input[type=password]::placeholder{color:#4d5a6b;letter-spacing:0}
  .row{display:flex;align-items:center;gap:8px;margin:13px 0 18px;font-size:13px;color:#8b98a9}
  .row input{width:15px;height:15px;accent-color:#4a7fd4;margin:0}
  .row label{cursor:pointer;user-select:none}
  button{
    width:100%;padding:13px 16px;font-size:15.5px;font-weight:600;
    color:#fff;background:#3b6fc4;border:0;border-radius:10px;cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  button:hover:not(:disabled){background:#487fd6}
  button:disabled{opacity:.55;cursor:default}
  .msg{
    margin:14px 0 0;font-size:13px;line-height:1.6;min-height:1.6em;
    color:#8b98a9;word-break:break-word;
  }
  .msg.err{color:#ff8b8b}
  .msg.ok{color:#6fd08c}
  .foot{
    margin:18px 0 0;padding-top:14px;border-top:1px solid #252e3a;
    font-size:11.5px;line-height:1.65;color:#5b6878;
  }
</style>
</head>
<body>
<main class="card">
  <div class="lock">
    <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
  </div>
  <h1>加密学习资料</h1>
  <p class="sub">本页内容以 AES-256 加密存放，输入访问密码后解开。</p>

  <label class="fl" for="pw">访问密码</label>
  <input id="pw" type="password" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"
         autocomplete="current-password" autocapitalize="off" autocorrect="off"
         spellcheck="false" enterkeyhint="go">

  <div class="row">
    <input id="remember" type="checkbox" checked>
    <label for="remember">在这台设备上记住密码</label>
  </div>

  <button id="go" type="button">打开</button>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>

  <p class="foot">密码不随文件一起发布，服务器上只有密文。忘记密码无法找回，只能用原文件重新加密。</p>
</main>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'wqe_ai_pw_v1';
  var MAGIC = 'WQE1';

  var $pw = document.getElementById('pw');
  var $go = document.getElementById('go');
  var $msg = document.getElementById('msg');
  var $remember = document.getElementById('remember');
  var busy = false;

  function say(text, kind) {
    $msg.textContent = text || '';
    $msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function fail(text) {
    busy = false;
    $go.disabled = false;
    $go.textContent = '打开';
    say(text, 'err');
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function preflight() {
    if (!window.crypto || !window.crypto.subtle) {
      return '当前环境不能解密：浏览器只在 https / http 下开放加密接口。请用网址打开，不要直接双击本地文件。';
    }
    if (typeof DecompressionStream !== 'function') {
      return '浏览器版本偏旧，缺少解压能力。请更新 Safari（iOS 16.4+）或 Chrome 后再试。';
    }
    return null;
  }

  async function unlock(password) {
    if (busy) return;
    if (!password) { say('请先输入密码。', 'err'); $pw.focus(); return; }

    var bad = preflight();
    if (bad) { fail(bad); return; }

    busy = true;
    $go.disabled = true;
    $go.textContent = '处理中…';

    try {
      say('正在下载数据…');

      var res = await fetch('payload.bin', { cache: 'no-store' });
      if (!res.ok) {
        throw new Error('数据文件读取失败（HTTP ' + res.status + '）。请确认 payload.bin 与本页面在同一目录。');
      }
      var buf = new Uint8Array(await res.arrayBuffer());
      if (buf.length < 40) throw new Error('数据文件不完整。');

      var magic = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
      if (magic !== MAGIC) throw new Error('数据文件格式不对，可能下载被中断，请刷新重试。');

      var view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
      var iterations = view.getUint32(4);
      var salt = buf.subarray(8, 24);
      var iv = buf.subarray(24, 36);
      var cipher = buf.subarray(36);

      say('正在解密…');

      var baseKey = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      var plain;
      try {
        plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipher);
      } catch (e) {
        throw new Error('密码不对。检查大小写和中间的短横线。');
      }

      say('正在展开内容…');

      var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      var html = await new Response(stream).text();

      if ($remember.checked) lsSet(STORE_KEY, password);
      else lsDel(STORE_KEY);

      say('正在打开…', 'ok');

      document.open();
      document.write(html);
      document.close();

    } catch (err) {
      fail(err && err.message ? err.message : '打开失败，请刷新重试。');
    }
  }

  $go.addEventListener('click', function () { unlock($pw.value.trim()); });

  $pw.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); unlock($pw.value.trim()); }
  });

  $pw.addEventListener('input', function () {
    if ($msg.className.indexOf('err') > -1) say('');
  });

  // 已记住密码则自动打开
  var saved = lsGet(STORE_KEY);
  if (saved) {
    $pw.value = saved;
    unlock(saved);
  } else {
    $pw.focus();
  }
})();
</script>
</body>
</html>
